<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوزر ڊئش بورڊ - گوگل ريويو پورٽل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Noto Naskh Arabic', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">

    <div class="max-w-xl mx-auto space-y-5">

        <!-- User Header -->
        <header class="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center">
            <div>
                <h1 id="user-display-name" class="font-bold text-slate-800">منھنجو ڊئش بورڊ</h1>
                <p id="user-email" class="text-xs text-slate-400 mt-0.5">لوڊ ٿي رهيو آهي...</p>
                <button id="logout-btn" onclick="logout()" class="hidden text-[11px] text-red-500 font-bold mt-1 hover:underline">لاگ آئوٽ ٿيو</button>
            </div>
            <div id="balance-box" class="bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl text-left">
                <span class="text-[10px] text-emerald-600 block font-semibold">بيلنس</span>
                <span id="user-balance" class="text-base font-black text-emerald-700">Rs. 0</span>
            </div>
        </header>

        <!-- Auth Block -->
        <div id="auth-block" class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
            <!-- Tabs -->
            <div class="flex border-b text-sm font-bold text-center">
                <button id="tab-login-btn" onclick="switchTab('login')" class="w-1/2 pb-2 border-b-2 border-blue-600 text-blue-600">لاگ ان ٿيو</button>
                <button id="tab-signup-btn" onclick="switchTab('signup')" class="w-1/2 pb-2 text-slate-400">نئون اڪائونٽ ٺاهيو</button>
            </div>

            <p id="msg-box" class="text-center text-xs font-bold hidden py-2 rounded-lg"></p>

            <!-- Login Form -->
            <form id="login-form" onsubmit="event.preventDefault(); login();" class="space-y-3">
                <input type="email" id="login-email" placeholder="ايميل (Email)" required class="w-full border p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                <input type="password" id="login-pass" placeholder="پاسورڊ (Password)" required class="w-full border p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-blue-700 transition">لاگ ان ٿيو</button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" onsubmit="event.preventDefault(); signup();" class="space-y-3 hidden">
                <div class="flex gap-2">
                    <input type="text" id="reg-fname" placeholder="پھريون نالو (First Name)" required class="w-1/2 border p-2.5 rounded-xl text-xs outline-none">
                    <input type="text" id="reg-lname" placeholder="ٻيو نالو (Last Name)" required class="w-1/2 border p-2.5 rounded-xl text-xs outline-none">
                </div>
                
                <div class="flex gap-2 dir-ltr">
                    <span class="bg-slate-100 border p-2.5 rounded-xl text-xs text-slate-600 font-bold flex items-center">+92</span>
                    <input type="tel" id="reg-phone" placeholder="3001234567" required class="w-full border p-2.5 rounded-xl text-xs outline-none text-right">
                </div>

                <input type="email" id="reg-email" placeholder="ايميل (Email)" required class="w-full border p-2.5 rounded-xl text-xs outline-none">
                <input type="password" id="reg-pass" placeholder="پاسورڊ (گهٽ ۾ گهٽ 6 اکر)" required minlength="6" class="w-full border p-2.5 rounded-xl text-xs outline-none">
                
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-emerald-700 transition">اڪائونٽ رجسٽر ڪريو</button>
            </form>
        </div>

        <!-- Dynamic User Tasks Section -->
        <div id="tasks-container" class="hidden space-y-4">
            <h2 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span> توھان ڏانھن موڪليل نوان ٽاسڪ
            </h2>
            <div id="user-tasks-list" class="space-y-4"></div>
        </div>

    </div>

    <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDkyNDAsImV4cCI6MjEwMzcyNTI0MH0.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    function switchTab(type) {
        if(type === 'login') {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('tab-login-btn').className = "w-1/2 pb-2 border-b-2 border-blue-600 text-blue-600 font-bold";
            document.getElementById('tab-signup-btn').className = "w-1/2 pb-2 text-slate-400 font-bold";
        } else {
            document.getElementById('signup-form').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('tab-signup-btn').className = "w-1/2 pb-2 border-b-2 border-emerald-600 text-emerald-600 font-bold";
            document.getElementById('tab-login-btn').className = "w-1/2 pb-2 text-slate-400 font-bold";
        }
    }

    function showMsg(msg, isError = true) {
        const box = document.getElementById('msg-box');
        box.innerText = msg;
        box.classList.remove('hidden', 'bg-red-100', 'text-red-600', 'bg-emerald-100', 'text-emerald-600');
        box.classList.add(isError ? 'bg-red-100' : 'bg-emerald-100', isError ? 'text-red-600' : 'text-emerald-600');
    }

    async function login() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        showMsg('لاگ ان ٿي رهيو آهي...', false);
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            showMsg(error.message, true);
        } else {
            checkUser();
        }
    }

    async function signup() {
        const fname = document.getElementById('reg-fname').value.trim();
        const lname = document.getElementById('reg-lname').value.trim();
        const phone = '+92' + document.getElementById('reg-phone').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-pass').value.trim();

        showMsg('اڪائونٽ تيار ٿي رهيو آهي...', false);
        
        const { data, error } = await _supabase.auth.signUp({ 
            email, 
            password,
            options: {
                data: { first_name: fname, last_name: lname, phone: phone }
            }
        });

        if (error) {
            showMsg(error.message, true);
        } else if (data.user) {
            await _supabase.from('profiles').upsert([
                { id: data.user.id, email: email, first_name: fname, last_name: lname, phone: phone, balance: 0, is_admin: false }
            ]);
            showMsg('اڪائونٽ ڪاميابي سان ٺهي ويو! هاڻي لاگ ان ٿيو.', false);
            switchTab('login');
        }
    }

    async function logout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    async function checkUser() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            currentUser = user;
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('tasks-container').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;

            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
            
            if (profile) {
                if(profile.first_name) {
                    document.getElementById('user-display-name').innerText = `${profile.first_name} ${profile.last_name || ''}`;
                }
                document.getElementById('user-balance').innerText = `Rs. ${profile.balance || 0}`;
            }

            loadAssignedTasks();
        } else {
            document.getElementById('auth-block').classList.remove('hidden');
            document.getElementById('tasks-container').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('user-email').innerText = 'لاگ ان ٿيل ناهي';
        }
    }

    async function loadAssignedTasks() {
        const { data: tasks } = await _supabase.from('tasks')
            .select('*')
            .eq('assigned_user_id', currentUser.id)
            .eq('status', 'active')
            .order('id', { ascending: false });

        const list = document.getElementById('user-tasks-list');
        list.innerHTML = '';

        if (tasks && tasks.length > 0) {
            tasks.forEach(t => {
                list.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b pb-2">
                            <span class="bg-amber-100 text-amber-800 text-[11px] px-2.5 py-0.5 rounded-md font-bold">ٽاسڪ # ${t.id}</span>
                            <span class="text-emerald-600 font-bold text-xs">+ Rs. ${t.reward} PKR</span>
                        </div>
                        <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-xs text-blue-900 space-y-1">
                            <span class="font-bold block text-blue-700">⚠️ ضروري ترين ھدايت:</span>
                            <p>ھي ريويو توھان کي ھن Gmail اڪائونٽ تان ڏيڻو آھي:</p>
                            <p class="font-mono font-bold bg-white p-1.5 rounded-lg border text-blue-600 text-center select-all">${t.target_gmail || 'ڪو به اڪائونٽ'}</p>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold block mb-1">1. ھي ريويو ٽيڪسٽ ڪاپي ڪريو:</label>
                            <div class="flex gap-2">
                                <input type="text" readonly id="review-txt-${t.id}" value="${t.review_text}" class="w-full bg-slate-50 border p-2 rounded-lg text-xs font-mono">
                                <button onclick="copyTxt(${t.id})" class="bg-slate-800 text-white text-xs px-3 rounded-lg font-bold">ڪاپي</button>
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold block mb-1">2. گوگل ميپ تي وڃي ريويو ڏيو:</label>
                            <a href="${t.google_maps_link}" target="_blank" class="block text-center bg-blue-600 text-white text-xs py-2 rounded-xl font-bold">Google Maps کوليو ↗</a>
                        </div>
                        <div class="border-t pt-2">
                            <label class="text-[11px] text-slate-500 font-semibold block mb-1">3. ڏنل ريويو جي لنڪ ھتي پيسٽ ڪريو:</label>
                            <div class="flex gap-2">
                                <input type="url" id="proof-${t.id}" placeholder="https://..." class="w-full border p-2 rounded-lg text-xs outline-none">
                                <button onclick="submitProof(${t.id})" class="bg-emerald-600 text-white text-xs px-4 rounded-lg font-bold">Submit</button>
                            </div>
                        </div>
                    </div>`;
            });
        } else {
            list.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">توهان ڏانهن في الحال ڪو به نئون ٽاسڪ ناهي موڪليو ويو.</p>`;
        }
    }

    function copyTxt(id) {
        const input = document.getElementById(`review-txt-${id}`);
        input.select();
        navigator.clipboard.writeText(input.value);
        alert('ڪمينٽ ڪاپي ٿي ويو!');
    }

    async function submitProof(taskId) {
        const proofLink = document.getElementById(`proof-${taskId}`).value;
        if (!proofLink) return alert('مھرباني ڪري ثبوت واري لنڪ داخل ڪريو');

        const { error } = await _supabase.from('submissions').insert([
            { task_id: taskId, user_id: currentUser.id, proof_link: proofLink }
        ]);

        if (!error) {
            alert('ثبوت تصديق لاء ايڊمن ڏانھن موڪليو ويو!');
            loadAssignedTasks();
        } else {
            alert(error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
